name: Sync upstream trash-pcd

# Sync the full upstream migration history while preserving local profiles.

on:
  schedule:
    # Mondays at 06:00 UTC. Adjust if you want a different cadence.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/sync-upstream.yml", "scripts/**", "ops/**", "pcd.json"]
  pull_request:
    paths: [".github/workflows/sync-upstream.yml", "scripts/**", "ops/**", "pcd.json"]

permissions: {}

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled during repository inactivity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/sync-upstream.yml/enable"

  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Install sqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sqlite3

      - name: Regenerate ops/ from upstream
        run: python3 scripts/regen-ops.py --refresh --upstream-only

      - name: Check clean-checkout sync and local policy
        run: |
          python3 scripts/test_sync_upstream.py
          python3 scripts/test_hevc_policy.py

      - name: Validate generated SQL builds cleanly
        run: |
          set -euo pipefail
          rm -f /tmp/pcd-validate.db
          {
            echo "PRAGMA foreign_keys=ON;"
            cat scripts/.cache/schema.sql
            cat ops/1.initial.sql
            cat ops/2.profiles.sql
          } | sqlite3 -bail /tmp/pcd-validate.db
          test -z "$(sqlite3 /tmp/pcd-validate.db 'PRAGMA foreign_key_check;')"
          echo "Row counts:"
          sqlite3 /tmp/pcd-validate.db "
            SELECT 'quality_profiles', COUNT(*) FROM quality_profiles
            UNION ALL SELECT 'custom_formats', COUNT(*) FROM custom_formats
            UNION ALL SELECT 'regular_expressions', COUNT(*) FROM regular_expressions;
          "

      - name: Open PR if upstream changed
        if: >-
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          github.ref_name == github.event.repository.default_branch
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: sync upstream trash-pcd"
          title: "Sync upstream trash-pcd"
          body: |
            Automated sync of vendored CFs from
            [`Dictionarry-Hub/trash-pcd`](https://github.com/Dictionarry-Hub/trash-pcd).

            Triggered by: `${{ github.event_name }}`

            All upstream SQL migrations applied using the schema version in pcd.json.
            Local profiles and scores are preserved. SQL and regression checks passed.

            Merge once you've reviewed the diff.
          branch: sync/trash-pcd
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          add-paths: |
            ops/1.initial.sql
